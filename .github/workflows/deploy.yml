# ============================================================================ #
# GitHub Actions — Build, Push, Deploy
# ============================================================================ #
# Trigger: manual (workflow_dispatch) OR push to main that touches app/**
#
# What it does:
# 1. Authenticates to AWS via OIDC (no stored credentials)
# 2. Builds the Docker image, tagged with the commit SHA
# 3. Pushes it to ECR
# 4. Runs terraform apply with TF_VAR_app_version=<sha>
# 5. Terraform updates the launch template → auto-triggers ASG refresh
# 6. Waits for the refresh to complete
# ============================================================================ #
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Manual image tag override (optional)'
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: threetier-app
  AWS_ROLE_ARN: arn:aws:iam::542035163411:role/threetier-github-actions-role
  TF_WORKING_DIR: terraform

jobs:
  build-push-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |

          tag="\${GITHUB_SHA::12}"
          echo "tag=$tag" >> "GITHUB_OUTPUT"
          echo "Using image tag: \$tag"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: \${{ env.AWS_ROLE_ARN }}
          aws-region: \${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            \${{ steps.ecr-login.outputs.registry }}/\({{ env.ECR_REPOSITORY }}:\){{ steps.vars.outputs.tag }}
             steps.ecr-login.outputs.registry /{{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        working-directory: \${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: \${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_app_version: \${{ steps.vars.outputs.tag }}
        run: terraform apply -auto-approve -input=false

      - name: Wait for instance refresh
        run: |
          echo "Checking for in-progress instance refresh..."
          ASG_NAME=(cd {{ env.TF_WORKING_DIR }} && terraform output -raw asg_name)
          
          for i in \$(seq 1 60); do
            REFRESH=\$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "\$ASG_NAME" \
              --query "InstanceRefreshes[0].[Status,PercentageComplete]" \
              --output text 2>/dev/null || echo "none 0")
            
            Status=(echo "REFRESH" | awk '{print \$1}')
            PCT=(echo "REFRESH" | awk '{print \$2}')
            echo "[\$i] Refresh status: Status (PCT%)"
            
            case "\$Status" in
              Successful|successful)
                echo "Refresh complete: \$Status"
                exit 0
                ;;
              Cancelled|Failed|RollbackSuccessful|RollbackFailed)
                echo "Refresh failed or was aborted: \$Status"
                exit 1
                ;;
              *)
                sleep 20
                ;;
            case
          done
          echo "Timeout waiting for instance refresh"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          cat << 'EOF' >> \$GITHUB_STEP_SUMMARY
          ## Deployment Summary
          
          - **Image tag:** `${{ steps.vars.outputs.tag }}`
          - **ECR:** `${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}`
          - **AWS Region:** `${{ env.AWS_REGION }}`
          
          Image pushed and ASG refresh monitoring complete.
          EOF
