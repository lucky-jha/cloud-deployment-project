# ============================================================================
# GitHub Actions — Build, Push, Deploy
# ============================================================================
# Trigger: push to main touching app/** (or this workflow file)
# ============================================================================
# ============================================================================
#
# What it does:
#   1. Authenticates to AWS via OIDC (no stored credentials)
#   2. Builds the Docker image, tagged with the commit SHA
#   3. Pushes it to ECR
#   4. Runs terraform apply with TF_VAR_app_version=<sha>
#   5. Terraform updates the launch template → auto-triggers ASG refresh
#   6. Waits for the refresh to complete
# ============================================================================

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: threetier-app
  AWS_ROLE_ARN: arn:aws:iam::542035163411:role/threetier-github-actions-role
  TF_WORKING_DIR: terraform

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            --tag "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}" \
            --tag "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .

      - name: Push image to ECR
        run: |
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_app_version: ${{ steps.vars.outputs.tag }}
        run: |
          terraform apply -auto-approve -input=false

            # ---------- 10. Trigger + wait for instance refresh ----------
      - name: Trigger and wait for instance refresh
        run: |
          ASG_NAME=$(cd ${{ env.TF_WORKING_DIR }} && terraform output -raw asg_name)
          echo "Target ASG: $ASG_NAME"

          # Cancel any refresh currently in progress (idempotent)
          echo "Cancelling any in-progress refresh..."
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" 2>/dev/null || echo "No refresh to cancel"

          # Wait for cancellation to register
          sleep 15

          # Start a fresh refresh
          echo "Starting new instance refresh..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'

          # Wait up to 20 minutes
          for i in $(seq 1 60); do
            REFRESH=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "InstanceRefreshes[0].[Status,PercentageComplete]" \
              --output text 2>/dev/null || echo "None 0")

            STATUS=$(echo "$REFRESH" | awk '{print $1}')
            PCT=$(echo "$REFRESH" | awk '{print $2}')
            echo "[$i] Refresh status: $STATUS ($PCT%)"

            case "$STATUS" in
              Successful)
                echo "Refresh complete."
                exit 0
                ;;
              Cancelled|Failed|RollbackSuccessful|RollbackFailed)
                echo "Refresh ended with: $STATUS"
                exit 1
                ;;
              *) sleep 20 ;;
            esac
          done

          echo "Timed out waiting for instance refresh"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ steps.vars.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR:** \`${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY